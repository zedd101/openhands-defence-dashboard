name: Update Exchange Rate

on:
  schedule:
    # UTC 기준 00:00 = 한국 시간(KST) 매일 아침 09:00 (월~금 평일 실행)
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # 관리자가 필요할 때 수동으로 즉시 [Run] 누를 수 있는 버튼 활성화

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 자동 푸시할 수 있는 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 최신 환율 수집 실행
        run: python fetch_rate.py

      - name: 변경된 rate.js 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rate.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "최신 환율 자동 갱신 (GitHub Actions)" && git push)
